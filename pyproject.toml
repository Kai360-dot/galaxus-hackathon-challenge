[project]
name = "glx-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "ipykernel>=7.4.0",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "peft>=0.22.0",
    "pillow>=13.0.0",
    "py7zr>=1.1.4",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "six>=1.17.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
transformers = { git = "https://github.com/swiss-ai/transformers.git", rev = "apertusv1p5-release-pre-upstream" }
